<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Routezilla UX Prototype</title><style>
:root{--nav:#062b4b;--blue:#1768ee;--bg:#f4f6f8;--line:#d7e0e8;--text:#062646;--muted:#617791;--green:#65bf14}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px}.app{display:flex;min-height:100vh}.side{width:225px;background:linear-gradient(#0a3558,#02233f);color:#fff;padding:20px 10px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:700;padding:0 12px 24px}.brand b{display:inline-block;background:linear-gradient(135deg,#287cff 55%,#9be43b 55%);padding:8px;border-radius:8px;margin-right:10px}.acct{background:#123e62;border-radius:12px;padding:14px 12px;margin-bottom:22px}.acct strong{display:block}.acct small{opacity:.8}.nav a{display:block;color:#fff;text-decoration:none;padding:14px 14px;border-radius:8px;margin:3px 0;font-weight:600}.nav a.active,.nav a:hover{background:#57e53b;color:#062646}.settings-link{position:absolute;bottom:16px;left:10px;right:10px}.main{margin-left:225px;width:calc(100% - 225px)}header{height:82px;background:#fff;border-bottom:1px solid var(--line);padding:18px 26px;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0 0 6px;font-weight:500}.sub{color:var(--muted)}.topbtn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:13px 18px;font-weight:700}.content{padding:20px 22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:15px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.card{padding:22px}.card .k{font-size:12px}.card .v{font-size:25px;font-weight:700;margin:8px 0}.muted{color:var(--muted)}.grid3{display:grid;grid-template-columns:1.1fr 1.4fr .8fr;gap:14px}.panel h2{font-size:16px;font-weight:500;margin:0;padding:18px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:16px;border-bottom:1px solid #e6ebef;text-align:left}th{font-size:12px;color:var(--muted);font-weight:500}.pill{padding:7px 12px;border-radius:7px;background:#edf7df;color:#378b12;font-size:12px}.pending{background:#fff1cf;color:#b37a00}.toolbar{display:flex;gap:10px;margin-bottom:14px}.input,.select{background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px}.input{min-width:320px}.tabs{display:flex;gap:28px;padding:16px 18px;border-bottom:1px solid var(--line)}.tabs b{color:var(--blue)}.settings{display:grid;grid-template-columns:220px 1fr;gap:18px}.setnav a{display:block;text-decoration:none;color:#46617d;padding:13px;border-radius:7px;margin-bottom:3px}.setnav a.active,.setnav a:hover{background:#e5efff;color:#0860e9;font-weight:700}.setbody{min-height:620px}.sethead{padding:24px;border-bottom:1px solid var(--line)}.sethead h2{font-size:24px;font-weight:500;margin:10px 0}.center{height:430px;display:flex;align-items:center;justify-content:center;text-align:center}.check{font-size:30px;color:#4a9f12;background:#eff9e5;width:50px;height:50px;line-height:50px;border-radius:50%;margin:auto}.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:11px 15px;font-weight:700}.staffgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.staff{padding:17px}.schedule{display:grid;grid-template-columns:60px repeat(6,1fr);min-height:520px}.schedule>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px}.booking{margin:5px;padding:10px;border:1px solid #7dafff;border-radius:6px;background:#edf5ff;font-size:11px}.chart{height:230px;margin:20px;background:linear-gradient(to top,transparent 24%,#edf1f4 25%,transparent 26%,transparent 49%,#edf1f4 50%,transparent 51%,transparent 74%,#edf1f4 75%,transparent 76%);position:relative}.chart:after{content:'';position:absolute;left:2%;right:2%;top:60%;height:4px;background:#1768ee;transform:skewY(-10deg)}@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}}

/* Interactive affordance: show hand cursor on clickable prototype controls */
a, button, [data-page], [data-setting], [role="button"], select, input[type="checkbox"], input[type="radio"], input[type="submit"], input[type="button"], .clickable, .tab, .action, .menu, .edit { cursor: pointer; }
</style></head><body><div class='app'><aside class='side'><div class='brand'><b>R</b>Routezilla</div><div class='acct'><strong>SP &nbsp; Service Pro</strong><small>All locations</small></div><nav class='nav' id='nav'><a data-page='overview'>⌂ &nbsp; Overview</a><a data-page='bookings'>▣ &nbsp; Bookings</a><a data-page='calendar'>□ &nbsp; Calendar</a><a data-page='customers'>♙ &nbsp; Customers</a><a data-page='services'>◇ &nbsp; Services</a><a data-page='team'>♧ &nbsp; Team</a></nav><nav class='nav settings-link'><a data-page='settings'>⚙ &nbsp; Settings</a></nav></aside><main class='main'><header><div><h1 id='title'></h1><div class='sub' id='subtitle'></div></div><button class='topbtn'>+ &nbsp; Create booking</button></header><section class='content' id='content'></section></main></div><script>
const content=document.getElementById('content'), title=document.getElementById('title'), subtitle=document.getElementById('subtitle');
const navs=[...document.querySelectorAll('[data-page]')];
function activate(p){navs.forEach(a=>a.classList.toggle('active',a.dataset.page===p))}
const stat=(k,v,s)=>`<div class='card'><div class='k'>${k}</div><div class='v'>${v}</div><div class='muted'>${s}</div></div>`;
function overview(){title.textContent='Good morning';subtitle.textContent="Here’s what’s happening with your business today.";content.innerHTML=`<div class='cards'>${stat('Bookings remaining','53','of 100 this month')}${stat('Today','8 bookings','2 pending · 6 confirmed')}${stat('Revenue (MTD)','$12,840','↑ 18.6% vs last month')}${stat('Conversion rate','24.3%','↑ 4.2 points')}</div><div class='grid3'><div class='panel'><h2>Today’s schedule</h2><table>${[['8:30 AM','Sarah Johnson','Deep Clean'],['10:00 AM','Michael Brown','Carpet Cleaning'],['12:30 PM','Emily Davis','Window Cleaning'],['2:00 PM','David Wilson','Move Out Clean'],['3:30 PM','Lisa Martinez','House Cleaning']].map((r,i)=>`<tr><td><b>${r[0]}</b></td><td><b>${r[1]}</b><br><span class='muted'>${r[2]}</span></td><td><span class='pill ${i==2||i==4?'pending':''}'>${i==2||i==4?'Pending':'Confirmed'}</span></td></tr>`).join('')}</table></div><div class='panel'><h2>Booking activity</h2><div class='chart'></div><div class='cards' style='grid-template-columns:repeat(3,1fr);margin:0'><div class='card'><b>110</b><br><small>Total bookings</small></div><div class='card'><b>$24,680</b><br><small>Total revenue</small></div><div class='card'><b>$224</b><br><small>Avg. booking</small></div></div></div><div class='panel'><h2>Availability</h2>${['Wed 3 / 8 slots','Thu 5 / 8 slots','Fri 8 / 8 slots','Sat 2 / 6 slots','Mon 6 / 8 slots'].map(x=>`<div style='padding:16px'><b>${x}</b><hr style='border:0;height:5px;background:#65bf14;border-radius:4px'></div>`).join('')}</div></div>`}
function bookings(){title.textContent='Bookings';subtitle.textContent='Find and manage every booking.';let rows=[['#1048','Sophia Martin','House Cleaning','Jul 29 · 8:30 AM','Confirmed'],['#1049','Emma Lewis','Deep Clean','Jul 29 · 10:00 AM','Confirmed'],['#1050','Daniel Kim','Carpet Cleaning','Jul 29 · 12:30 PM','Pending'],['#1051','Olivia Taylor','Window Cleaning','Jul 29 · 2:00 PM','In progress']];content.innerHTML=`<div class='toolbar'><div class='input'>⌕ &nbsp; Search customer, address or booking ID</div><div class='select'>Today</div><div class='select'>All statuses⌄</div></div><div class='panel'><div class='tabs'><b>Upcoming 28</b><span>Past</span><span>Cancelled</span></div><table><tr><th>Booking</th><th>Customer</th><th>Service</th><th>Date & time</th><th>Status</th></tr>${rows.map(r=>`<tr>${r.slice(0,4).map((x,i)=>`<td>${i<2?'<b>'+x+'</b>':x}</td>`).join('')}<td><span class='pill ${r[4]=='Pending'?'pending':''}'>${r[4]}</span></td></tr>`).join('')}</table></div>`}
function calendar(){title.textContent='Schedule';subtitle.textContent='Manage staff, teams and bookings in one place.';content.innerHTML=`<div class='cards'>${stat('Today','8 bookings','↑ 2 vs yesterday')}${stat("Today’s revenue",'$2,890','↑ 18% vs yesterday')}${stat('Utilization','72%','12 of 16 staff scheduled')}${stat('Plan capacity','53 remaining','53% used')}</div><div class='panel'><h2>Today’s schedule</h2><div class='schedule'>${['Time','Unassigned','Tom Harris','Lisa Morgan','David Chen','Emily Roberts','James Lee','8 AM'].map(x=>`<div><b>${x}</b></div>`).join('')}${['Deep Clean','AC Maintenance','House Cleaning','Electrical Install','Gutter Cleaning','Unavailable','9 AM','', 'Plumbing Repair','Carpet Cleaning','Lighting Upgrade','Pressure Washing','Oven Repair','12 PM','', 'Drain Cleaning','Move Out Clean','Outlet Repair','Roof Inspection','Appliance Diagnostic'].map(x=>`<div>${x?`<div class='booking'><b>${x}</b><br>Customer</div>`:''}</div>`).join('')}</div></div>`}
function customers(){title.textContent='Customers';subtitle.textContent='Manage your customer relationships in one place.';let rs=[['Sarah Johnson','sarah@example.com','Kelowna, BC','8','Jul 29','Active'],['Michael Brown','michael@example.com','Langley, BC','5','Jul 29','Active'],['Emily Davis','emily@example.com','Maple Ridge, BC','3','Jul 29','Active'],['David Wilson','david@example.com','Vancouver, BC','6','Jul 28','Active']];content.innerHTML=`<div class='toolbar'><div class='input'>⌕ &nbsp; Search customers</div><button class='btn'>+ Add customer</button></div><div class='panel'><table><tr><th>Name</th><th>Contact</th><th>Address</th><th>Bookings</th><th>Last booking</th><th>Status</th></tr>${rs.map(r=>`<tr>${r.map((x,i)=>`<td>${i==0?'<b>'+x+'</b>':i==5?'<span class="pill">'+x+'</span>':x}</td>`).join('')}</tr>`).join('')}</table></div>`}
function services(){title.textContent='Services';subtitle.textContent='Configure what customers can book online.';let rs=[['1','Free Estimate','30 min','Free','Active'],['2','Carpet Cleaning','2 hr','$180','Active'],['3','Deep Clean','3 hr','$320','Active'],['4','Move Out Clean','4 hr','$450','Draft']];content.innerHTML=`<div style='display:grid;grid-template-columns:1fr 280px;gap:15px'><div class='panel'><table>${rs.map(r=>`<tr><td><b>${r[0]}</b></td><td><b>${r[1]}</b><br><small class='muted'>Residential service</small></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td style='color:#1768ee'>Edit</td></tr>`).join('')}</table></div><div class='panel' style='padding:18px'><h3>Travel & scheduling</h3><p>☑ Compound mobility</p><p>Arrival window</p><div class='input'>30 minutes⌄</div><p>Travel radius</p><div class='input'>25 kilometres⌄</div><br><button class='input' style='width:100%'>Save travel rules</button></div></div>`}
function team(){title.textContent='People & availability';subtitle.textContent='Manage staff, teams and schedule exceptions.';content.innerHTML=`<div class='tabs'><b>Staff</b><span>Teams</span><span>Blackouts</span></div><h3>5 staff members</h3><div class='staffgrid'>${[['AA','Admin Admin','Administrator · Crew 1'],['SR','Steven Reed','Staff member · Crew 2'],['KSM','Ken Staff Member','Staff member · Crew 3'],['PSM','Pete Staff Member','Staff member · Crew 4']].map(r=>`<div class='panel staff'><b>${r[0]} &nbsp; ${r[1]}</b><br><span class='muted'>${r[2]}</span><span class='pill' style='float:right'>Active</span></div>`).join('')}</div>`}
const settingsNames=['Business profile','Hours & availability','Services','Locations','People & teams','Communications','Integrations & API','Data & reports','Billing & plan','Security'];
function settings(sel='Business profile'){title.textContent='Settings';subtitle.textContent='Configure how Routezilla works for your business.';content.innerHTML=`<div class='settings'><div class='setnav'>${settingsNames.map(n=>`<a href='#' data-setting='${n}' class='${n==sel?'active':''}'>${n}</a>`).join('')}</div><div class='panel setbody' id='setbody'></div></div>`;document.querySelectorAll('[data-setting]').forEach(a=>a.onclick=e=>{e.preventDefault();settings(a.dataset.setting)});renderSetting(sel)}
function renderSetting(s){let b=document.getElementById('setbody');let head=`<div class='sethead'><small style='color:#1768ee'><b>BUSINESS</b></small><h2>${s}</h2><div class='muted'>Manage your organization’s core information and preferences.</div></div>`;if(s==='Business profile')b.innerHTML=head+`<div style='padding:28px'><h3>Company logo</h3><button class='input'>Change logo</button><div class='staffgrid' style='margin-top:20px'><div><b>Company name</b><div class='input'>SERVICE PRO</div></div><div><b>Brand colour</b><div class='input'>■ &nbsp; #2563EB</div></div><div><b>Contact email</b><div class='input'>ken@routezilla.com</div></div><div><b>Phone</b><div class='input'>+1 (877) 702-5555</div></div></div><p><b>Website</b></p><div class='input'>https://thebestcarservice.com</div></div>`;else if(s==='Locations')b.innerHTML=head+`<div style='padding:24px;display:grid;grid-template-columns:1.2fr .9fr;gap:15px'><div class='panel' style='height:340px;background:#dff2e8;display:flex;align-items:center;justify-content:center'><h2>Vancouver</h2></div><div class='panel'><h2>Service locations</h2>${['Maple Ridge','Oak Street','Kelowna','Langley'].map((x,i)=>`<div style='padding:16px;border-bottom:1px solid #eee'><b>${String.fromCharCode(65+i)} &nbsp; ${x}</b><span style='float:right;color:#1768ee'>Edit</span></div>`).join('')}</div></div>`;else if(s==='Integrations & API')b.innerHTML=head+`<div style='padding:24px'><div class='card' style='background:#eef5ff'><b>API access is protected</b><p>Keys are hidden by default and should be scoped to the minimum required permissions.</p></div><div class='card'><b>Production API key</b><span style='float:right'>rz_live_••••••••••9F2A &nbsp; <button>Reveal</button> <button>Rotate</button></span></div><br><button class='btn'>+ Create API key</button></div>`;else if(s==='Billing & plan')b.innerHTML=head+`<div style='padding:24px'><div class='card' style='background:#eef5ff'><small>CURRENT PLAN</small><p>Starter · Yearly</p><b>53 of 100 bookings remaining.</b></div><div class='cards' style='grid-template-columns:repeat(3,1fr)'>${[['Starter','$24.58','100'],['Basic','$127.50','500'],['Premium','$223.08','1,000']].map((r,i)=>`<div class='card'><small>${i?'AVAILABLE PLAN':'CURRENT PLAN'}</small><h3>${r[0]}</h3><div class='v'>${r[1]} <small>/ month</small></div><p>${r[2]} bookings per month</p><button class='${i?'input':'btn'}' style='width:100%'>${i?'Choose plan':'Current plan'}</button></div>`).join('')}</div></div>`;else b.innerHTML=head+`<div class='center'><div><div class='check'>✓</div><h2>${s}</h2><p class='muted'>This wireframe establishes the reorganized settings architecture. Detailed<br>controls follow this same component system.</p><button class='btn'>Configure ${s.toLowerCase()}</button></div></div>`}
const pages={overview,bookings,calendar,customers,services,team,settings};navs.forEach(a=>a.onclick=()=>{let p=a.dataset.page;activate(p);pages[p]()});activate('overview');overview();
</script></body></html>
